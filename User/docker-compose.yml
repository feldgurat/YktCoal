# Для standalone-запуска. В продакшене используйте корневой docker-compose.yml
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./db/app.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=change-me-in-production
      - DEFAULT_ADMIN_NAME=Admin
      - DEFAULT_ADMIN_PHONE=+70000000000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  sqlite_data:
