components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      description: ID (uuid)
      schema:
        type: string
        format: uuid

    FromDate:
      in: query
      name: from
      required: true
      description: Начало временного отрезка (DD-MM-YYYY)
      schema:
        type: string
        format: date

    ToDate:
      in: query
      name: to
      required: true
      description: Конец временного отрезка (DD-MM-YYYY)
      schema:
        type: string
        format: date
    

    Limit:
      in: query
      name: limit
      description: Сколько записей вернуть
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Self:
      in: query
      name: self
      description: Только для себя или нет
      schema:
        type: boolean
        default: true

    Offset:
      in: query
      name: offset
      description: Сколько записей пропустить
      schema:
        type: integer
        minimum: 0
        default: 0

    UserType:
      in: query
      name: UserType
      description: Тип пользователя (клиент/водитель)
      schema:
        type: string

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InvalidDate:
      description: Некоректная дата
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Не авторизован (нет/неверный JWT)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Нет прав доступа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    
    Conflict:
      description: Уже есть статус
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    FilePath:
      type: string
      description: Относительный путь к файлу на сервере (начинается с "/")
      pattern: "^/.*"
      example: /uploads/docs/passport-123.jpg

    PhoneNumber:
      type: string
      description: Контактный телефон (рекомендуется E.164)
      example: "+880053535"
      pattern: "^\\+?[1-9]\\d{1,14}$"

    ErrorResponse:
      type: object
      description: Ошибка API
      properties:
        message:
          type: string
          description: Описание ошибки
        code:
          type: string
          description: Машинный код ошибки
        details:
          type: object
          nullable: true
          description: "Доп. детали (например, ошибки валидации)"
          additionalProperties: true
      required: [message]

    LoginRequest:
      type: object
      description: Данные для входа (email + password)
      properties:
        email:
          type: string
          format: email
          description: Email
        password:
          type: string
          format: password
          writeOnly: true
          description: Пароль
      required: [email, password]

    RegisterRequest:
      type: object
      description: Данные для регистрации
      properties:
        email:
          type: string
          format: email
          description: Email
        password:
          type: string
          format: password
          writeOnly: true
          description: Пароль
        contactNumber:
          $ref: "#/components/schemas/PhoneNumber"
      required: [email, password, contactNumber]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh-токен
      required: [refreshToken]

    AuthTokens:
      type: object
      description: Пара токенов авторизации
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: integer
          description: Срок жизни accessToken в секундах
          example: 3600
        refreshToken:
          type: string
          nullable: true
          description: Refresh token (может отсутствовать/быть null, если не используете)
      required: [tokenType, accessToken, expiresIn]


    Profile:
      type: object
      description: Данные профиля пользователя
      properties:
        name:
          type: string
          description: Имя пользователя
        birthDate:
          type: string
          format: date
