services:
  driver-backend:
    build:
      context: ..
      dockerfile: Driver/Dockerfile
    ports:
      - "8002:8002"
    environment:
      APP_PORT: 8002
    env_file:
      - .env
    volumes:
      - .:/app
      - driver-uploads:/data/uploads
    restart: unless-stopped

volumes:
  driver-uploads:
